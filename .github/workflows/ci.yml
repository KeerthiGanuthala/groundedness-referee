name: Verify groundedness-referee

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run full offline verification (fixtures, tests, coverage, experiments, number check)
        run: make verify

      - name: Assert git working tree is clean after regeneration
        run: git diff --exit-code
